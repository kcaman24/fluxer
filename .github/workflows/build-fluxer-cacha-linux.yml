# ==============================================================================
# CaCha-Fluxer Desktop Build Workflow (Sadece Linux x64)
# ==============================================================================

name: Build CaCha-Fluxer (Linux)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build (linux x64)
    runs-on: ubuntu-22.04

    steps:
      # ======================================================================
      # ADIM 1: Kaynak kodu indir
      # ======================================================================
      - name: Checkout source
        uses: actions/checkout@v4

      # ======================================================================
      # ADIM 2: Rust toolchain kur (1.93.0 sabit)
      # ======================================================================
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"
          targets: x86_64-unknown-linux-gnu

      # ======================================================================
      # ADIM 3: Node.js 20 kur
      # ======================================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ======================================================================
      # ADIM 4: pnpm kur (corepack üzerinden)
      # ======================================================================
      - name: Setup pnpm
        shell: bash
        run: corepack enable && corepack prepare pnpm@latest --activate

      # ======================================================================
      # ADIM 5: Linux sistem bağımlılıklarını kur
      # ======================================================================
      - name: Install Linux system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            llvm \
            clang \
            libclang-dev \
            pkg-config \
            python3 \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libdbus-1-dev \
            libpulse-dev \
            libevdev-dev \
            libssl-dev \
            libvpx-dev \
            libopus-dev \
            libudev-dev \
            libpcsclite-dev \
            libfido2-dev

      # ======================================================================
      # ADIM 6: Node.js bağımlılıklarını kur (KÖK DİZİNDE)
      # ======================================================================
      - name: Install Node.js dependencies (root)
        shell: bash
        run: pnpm install

      # ======================================================================
      # ADIM 7: Kaynak kodu derle
      # ======================================================================
      # KRİTİK ÇÖZÜM: PKG_CONFIG_PATH ve LIBDIR ile pkg-config'in libfido2'yi 
      # bulması sağlanır. CFLAGS ve CXXFLAGS ile clang'ın header'ları bulması sağlanır.
      - name: Build desktop app
        working-directory: fluxer_desktop
        shell: bash
        env:
          NODE_ENV: production
          FLUXER_DESKTOP_PRODUCTION: 'true'
          PUBLIC_RELEASE_CHANNEL: stable
          PUBLIC_BUILD_VERSION: ${{ github.ref_name }}
          ELECTRON_ARCH: x64
          LIBCLANG_PATH: /usr/lib/llvm-14/lib
          BINDGEN_EXTRA_CLANG_ARGS: "-I/usr/include -I/usr/include/x86_64-linux-gnu"
          # pkg-config'in çoklu mimari (multiarch) yollarını görmesini sağla
          PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig
          PKG_CONFIG_LIBDIR: /usr/lib/x86_64-linux-gnu/pkgconfig
          PKG_CONFIG_ALLOW_SYSTEM_CFLAGS: 1
          PKG_CONFIG_ALLOW_SYSTEM_LIBS: 1
          # C/C++ derleyicisine direkt include yollarını ver
          CFLAGS: "-I/usr/include"
          CXXFLAGS: "-I/usr/include"
          C_INCLUDE_PATH: /usr/include
          CPLUS_INCLUDE_PATH: /usr/include
          LIBRARY_PATH: /usr/lib/x86_64-linux-gnu
        run: pnpm build

      # ======================================================================
      # ADIM 8: Uygulamayı paketle
      # ======================================================================
      - name: Package Linux app
        working-directory: fluxer_desktop
        shell: bash
        env:
          ELECTRON_ARCH: x64
        run: pnpm exec electron-builder --config electron-builder.config.cjs --linux --publish never

      # ======================================================================
      # ADIM 9: Çıktıları (Artifacts) GitHub'a yükle
      # ======================================================================
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cacha-fluxer-linux-x64
          path: |
            **/*.AppImage
            **/*.deb
            **/*.rpm
            **/*.zip
          if-no-files-found: warn
          retention-days: 90