# ==============================================================================
# CaCha-Fluxer Desktop Build Workflow (macOS arm64 & Linux x64)
# ==============================================================================

name: Build CaCha-Fluxer Desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.platform }} ${{ matrix.arch }})
    
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS - Apple Silicon (arm64)
          # NOT: macos-14'teki Xcode 15.2+ libc++ bug'ı yüzünden macos-13 (Intel) runner kullanıyoruz.
          # Ancak rust_target'a aarch64-apple-darwin vererek Apple Silicon için çapraz derleme (cross-compile) yapıyoruz.
          # Bu yöntem hem bug'ı aşar hem de M1/M2/M3 çipte çalışan .dmg üretir.
          - os: macos-13
            platform: mac
            arch: arm64
            rust_target: aarch64-apple-darwin
          
          # Linux - x64
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            rust_target: x86_64-unknown-linux-gnu

          # --- WINDOWS YORUM SATIRINA ALINDI (Sorunsuz çalıştığı için) ---
          # - os: windows-latest
          #   platform: win
          #   arch: x64
          #   rust_target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      # ======================================================================
      # ADIM 1: Kaynak kodu indir
      # ======================================================================
      - name: Checkout source
        uses: actions/checkout@v4

      # ======================================================================
      # ADIM 2: Rust toolchain kur (1.93.0 sabit)
      # ======================================================================
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"
          targets: ${{ matrix.rust_target }}

      # ======================================================================
      # ADIM 3: Node.js 20 kur
      # ======================================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ======================================================================
      # ADIM 4: pnpm kur (corepack üzerinden)
      # ======================================================================
      - name: Setup pnpm
        shell: bash
        run: corepack enable && corepack prepare pnpm@latest --activate

      # ======================================================================
      # ADIM 5: İşletim sistemine göre sistem bağımlılıklarını kur
      # ======================================================================
      
      # --- Linux bağımlılıkları ---
      # libfido2-dev: WebAuthn için
      # llvm, libclang-dev: Rust bindgen'in fido/es384.h dosyasını bulabilmesi için
      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            llvm \
            clang \
            libclang-dev \
            pkg-config \
            python3 \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libdbus-1-dev \
            libpulse-dev \
            libevdev-dev \
            libssl-dev \
            libvpx-dev \
            libopus-dev \
            libudev-dev \
            libpcsclite-dev \
            libfido2-dev

      # --- macOS bağımlılıkları ---
      - name: Install macOS system dependencies
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          brew install nasm yasm pkg-config cmake python-setuptools

      # ======================================================================
      # ADIM 6: Node.js bağımlılıklarını kur (KÖK DİZİNDE)
      # ======================================================================
      - name: Install Node.js dependencies (root)
        shell: bash
        run: pnpm install

      # ======================================================================
      # ADIM 7: Kaynak kodu derle
      # ======================================================================
      # KRİTİK DÜZELTME: Linux için LIBCLANG_PATH ve BINDGEN_EXTRA_CLANG_ARGS eklendi.
      # Bu sayede fido/es384.h hatası çözülür.
      # macOS arm64 için MACOSX_DEPLOYMENT_TARGET=11.0 ayarlandı (M1 minimum sürümü).
      - name: Build desktop app
        working-directory: fluxer_desktop
        shell: bash
        env:
          NODE_ENV: production
          FLUXER_DESKTOP_PRODUCTION: 'true'
          PUBLIC_RELEASE_CHANNEL: stable
          PUBLIC_BUILD_VERSION: ${{ github.ref_name }}
          ELECTRON_ARCH: ${{ matrix.arch }}
          # Linux: clang'a sistem header'larını bulması için yol ver
          LIBCLANG_PATH: ${{ matrix.platform == 'linux' && '/usr/lib/llvm-14/lib' || '' }}
          BINDGEN_EXTRA_CLANG_ARGS: ${{ matrix.platform == 'linux' && '-I/usr/include -I/usr/include/x86_64-linux-gnu' || '' }}
          # macOS: SDK ve deployment target ayarla
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.platform == 'mac' && '11.0' || '' }}
          SDKROOT: ${{ matrix.platform == 'mac' && '/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk' || '' }}
        run: pnpm build

      # ======================================================================
      # ADIM 8: Uygulamayı paketle
      # ======================================================================
      
      # --- macOS paketleme ---
      - name: Package macOS app
        if: matrix.platform == 'mac'
        working-directory: fluxer_desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_ARCH: ${{ matrix.arch }}
          MACOSX_DEPLOYMENT_TARGET: '11.0'
          SDKROOT: '/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk'
        run: pnpm exec electron-builder --config electron-builder.config.cjs --mac --publish never

      # --- Linux paketleme ---
      - name: Package Linux app
        if: matrix.platform == 'linux'
        working-directory: fluxer_desktop
        shell: bash
        env:
          ELECTRON_ARCH: ${{ matrix.arch }}
        run: pnpm exec electron-builder --config electron-builder.config.cjs --linux --publish never

      # ======================================================================
      # ADIM 9: Çıktıları (Artifacts) GitHub'a yükle
      # ======================================================================
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cacha-fluxer-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            **/*.dmg
            **/*.AppImage
            **/*.deb
            **/*.rpm
            **/*.zip
          if-no-files-found: warn
          retention-days: 90