# ==============================================================================
# CaCha-Fluxer Desktop Build Workflow (Windows x64, macOS arm64, Linux x64)
# ==============================================================================

name: Build CaCha-Fluxer Desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.platform }} ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            rust_target: x86_64-pc-windows-msvc
          - os: macos-14
            platform: mac
            arch: arm64
            rust_target: aarch64-apple-darwin
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            rust_target: x86_64-unknown-linux-gnu

    steps:
      # ======================================================================
      # ADIM 1: Kaynak kodu indir
      # ======================================================================
      - name: Checkout source
        uses: actions/checkout@v4

      # ======================================================================
      # ADIM 2: Rust toolchain kur (1.93.0 sabit)
      # ======================================================================
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"
          targets: ${{ matrix.rust_target }}

      # ======================================================================
      # ADIM 3: Node.js 20 kur
      # ======================================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ======================================================================
      # ADIM 4: pnpm kur (corepack üzerinden)
      # ======================================================================
      - name: Setup pnpm
        shell: bash
        run: corepack enable && corepack prepare pnpm@latest --activate

      # ======================================================================
      # ADIM 5a: Windows - Python kur (bazı native addon build script'leri icin)
      # ======================================================================
      - name: Setup Python (Windows)
        if: matrix.platform == 'win'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # ======================================================================
      # ADIM 5b: Linux - guncel libfido2 + pipewire icin PPA ekle
      # ======================================================================
      # jammy'nin apt deposundaki libfido2 (1.10.0) ve pipewire (0.3.48) eski;
      # libfido2-sys ve libspa Rust crate'leri daha yeni C API bekliyor
      # (fido/es384.h, spa_meta_region_is_valid vb.). Upstream PPA'lardan
      # guncel surumleri kuruyoruz.
      - name: Add upstream PPAs (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:yubico/stable
          sudo add-apt-repository -y ppa:pipewire-debian/pipewire-upstream
          sudo apt-get update

      # ======================================================================
      # ADIM 5c: Linux sistem bağımlılıklarını kur
      # ======================================================================
      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get install -y \
            build-essential cmake llvm clang libclang-dev pkg-config python3 \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev libdbus-1-dev libpulse-dev \
            libevdev-dev libssl-dev libvpx-dev libopus-dev libudev-dev \
            libpcsclite-dev libfido2-1 libfido2-dev fido2-tools \
            libpipewire-0.3-0 libpipewire-0.3-dev libspa-0.2-dev libva-dev

      # ======================================================================
      # ADIM 5d: Linux - fido2 + pipewire header dogrulama (erken hata yakalama)
      # ======================================================================
      - name: Verify native library headers (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          test -f /usr/include/fido/es384.h && echo "es384.h OK" || (echo "es384.h MISSING" && exit 1)
          pkg-config --modversion libpipewire-0.3
          grep -q "spa_meta_region_is_valid" /usr/include/spa-0.2/spa/buffer/meta.h \
            && echo "spa_meta_region_is_valid OK" \
            || (echo "spa_meta_region_is_valid MISSING" && exit 1)

      # ======================================================================
      # ADIM 5e: macOS sistem bağımlılıklarını kur (Homebrew)
      # ======================================================================
      # NOT: 'pipewire' formulu KASITLI olarak listede yok - Homebrew'da
      # sadece Linux'ta destekleniyor. '|| true' de kullanmiyoruz ki gercek
      # kurulum hatalari sessizce yutulmasin.
      - name: Install macOS system dependencies
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          brew update
          brew install cmake pkg-config libfido2 opus libvpx ffmpeg

      # ======================================================================
      # ADIM 5f: macOS - libfido2 header dogrulama + pkg-config yolu
      # ======================================================================
      - name: Verify fido2 headers (macOS)
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          FIDO2_PREFIX=$(brew --prefix libfido2)
          if [ -f "$FIDO2_PREFIX/include/fido/es384.h" ]; then
            echo "es384.h OK"
          else
            echo "es384.h MISSING"; exit 1
          fi
          echo "PKG_CONFIG_PATH_EXTRA=$FIDO2_PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"

      # ======================================================================
      # ADIM 6: Node.js bağımlılıklarını kur (KÖK DİZİNDE)
      # ======================================================================
      - name: Install Node.js dependencies (root)
        shell: bash
        run: pnpm install

      # ======================================================================
      # ADIM 7: Kaynak kodu derle
      # ======================================================================
      # Linux: bindgen fido2 header'ini bulsun diye LIBCLANG_PATH + 
      # BINDGEN_EXTRA_CLANG_ARGS gerekiyor. CFLAGS/CXXFLAGS genel olarak
      # SET EDILMIYOR - onceden bunlarin cxx-build gibi crate'lerin
      # derlemesini kirdigini gorduk (stdlib.h bulunamadi hatasi); unset +
      # env -u ile de nereden gelirse gelsin sizmalarini engelliyoruz.
      #
      # macOS: webrtc-sys, cxx crate'ini -std=c++20 ile derliyor ama
      # cxx v1.0.194'un rust::Slice::iterator'i Xcode 15.4/MacOSX14.5 SDK'nin
      # libc++'indaki C++20 contiguous_iterator concept kontrolunu
      # karsilamiyor (pointer_traits::element_type/to_address eksik).
      # CXXFLAGS_aarch64_apple_darwin ile -std=c++17 zorlayip bu concept
      # kontrolunu hic tetiklememis oluyoruz (cxx.h, C++17'de
      # random_access_iterator_tag kullaniyor, sorun cikmiyor).
      - name: Build desktop app
        working-directory: fluxer_desktop
        shell: bash
        env:
          NODE_ENV: production
          FLUXER_DESKTOP_PRODUCTION: 'true'
          PUBLIC_RELEASE_CHANNEL: stable
          PUBLIC_BUILD_VERSION: ${{ github.ref_name }}
          ELECTRON_ARCH: ${{ matrix.arch }}
          LIBCLANG_PATH: ${{ matrix.platform == 'linux' && '/usr/lib/llvm-14/lib' || '' }}
          BINDGEN_EXTRA_CLANG_ARGS: ${{ matrix.platform == 'linux' && '-I/usr/include -I/usr/include/x86_64-linux-gnu' || '' }}
          PKG_CONFIG_PATH: ${{ matrix.platform == 'linux' && '/usr/lib/x86_64-linux-gnu/pkgconfig' || matrix.platform == 'mac' && format('/opt/homebrew/lib/pkgconfig:{0}', env.PKG_CONFIG_PATH_EXTRA) || '' }}
          PKG_CONFIG_LIBDIR: ${{ matrix.platform == 'linux' && '/usr/lib/x86_64-linux-gnu/pkgconfig' || '' }}
          PKG_CONFIG_ALLOW_SYSTEM_CFLAGS: 1
          PKG_CONFIG_ALLOW_SYSTEM_LIBS: 1
          LIBRARY_PATH: ${{ matrix.platform == 'linux' && '/usr/lib/x86_64-linux-gnu' || '' }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.platform == 'mac' && '11.0' || '' }}
          CXXFLAGS_aarch64_apple_darwin: ${{ matrix.platform == 'mac' && '-std=c++17' || '' }}
        run: |
          unset CFLAGS CXXFLAGS C_INCLUDE_PATH CPLUS_INCLUDE_PATH
          env -u CFLAGS -u CXXFLAGS -u C_INCLUDE_PATH -u CPLUS_INCLUDE_PATH pnpm build

      # ======================================================================
      # ADIM 8: Uygulamayı paketle
      # ======================================================================
      # macOS: CSC_IDENTITY_AUTO_DISCOVERY=false, Apple Developer sertifikasi
      # olmadigi icin electron-builder'in Keychain'de imzalama sertifikasi
      # aramasini engeller. Sonuc imzasiz .dmg - kullanicilar Gatekeeper
      # uyarisinda "sag tik > Ac" ile gecebilir.
      - name: Package macOS app
        if: matrix.platform == 'mac'
        working-directory: fluxer_desktop
        shell: bash
        env:
          ELECTRON_ARCH: arm64
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm exec electron-builder --config electron-builder.config.cjs --mac --arm64 --publish never

      - name: Package Windows/Linux app
        if: matrix.platform != 'mac'
        working-directory: fluxer_desktop
        shell: bash
        env:
          ELECTRON_ARCH: ${{ matrix.arch }}
        run: pnpm exec electron-builder --config electron-builder.config.cjs --${{ matrix.platform }} --publish never

      # ======================================================================
      # ADIM 9: Çıktıları (Artifacts) GitHub'a yükle
      # ======================================================================
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cacha-fluxer-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            **/*.exe
            **/*.dmg
            **/*.zip
            **/*.pkg
            **/*.AppImage
            **/*.deb
            **/*.rpm
          if-no-files-found: warn
          retention-days: 90