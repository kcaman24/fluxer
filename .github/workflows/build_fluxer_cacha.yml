# İş akışının (workflow) adı. GitHub Actions sekmesinde bu isimle görünür.
name: Build CaCha-Fluxer Desktop

# "on" bloğu, bu derlemenin ne zaman otomatik olarak başlayacağını belirler.
on:
  # Eğer "v1.0.0" gibi "v" harfiyle başlayan bir etiket (tag) push'larsan çalışır.
  push:
    tags: ['v*']
  # GitHub arayüzünden manuel olarak "Run Workflow" butonuna basıldığında da çalışmasına izin verir.
  workflow_dispatch:

# "jobs" bloğu, yapılacak asıl işleri (derleme süreçlerini) içerir.
jobs:
  build:
    # "strategy" ile aynı işi farklı ortamlarda (matrix) paralel olarak çalıştırabiliriz.
    strategy:
      fail-fast: false # Bir platformda hata çıkarsa diğerlerinin devam etmesine izin verir.
      matrix:
        # Intel Mac (macos-13) kaldırıldı. Sadece Apple Silicon, Windows ve Linux kaldı.
        include:
          - os: macos-14       # Apple Silicon (M1/M2/M3) çipli Mac ortamı
            platform: mac
            arch: arm64
          - os: windows-latest # Windows ortamı
            platform: win
            arch: x64
          - os: ubuntu-22.04   # Linux ortamı
            platform: linux
            arch: x64
            
    # Her bir matrix işi, yukarıda tanımladığımız o işletim sisteminde (os) çalışacak.
    runs-on: ${{ matrix.os }}
    
    # "steps" adımları sırayla çalıştırılacak komutlardır.
    steps:
      # 1. Adım: GitHub'daki fork'ladığınız repo kodlarını sunucuya indirir.
      - uses: actions/checkout@v4
      
      # 2. Adım: Rust toolchain'i kurar. Fluxer'ın CI araçlarını çalıştırmak için bu şart.
      - name: Set up Rust toolchain (CI helpers)
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.93.0"
          
      # 3. Adım: Node.js 20 sürümünü kurar.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      # 4. Adım: pnpm paket yöneticisini corepack üzerinden aktif eder.
      - name: Set up pnpm via corepack
        run: corepack enable && corepack prepare pnpm@latest --activate

      # 5. Adım: Sadece Windows için Python 3.13 kurar (Node native modülleri için gerekir).
      - name: Set up Python (Windows)
        if: matrix.platform == 'windows'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 6. Adım: Sadece Linux derlemesi için Fluxer'ın kendi CI aracı ile sistem bağımlılıklarını kurar.
      # Bu adım webrtc-sys ve libfido2 hatalarını çözer.
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: cargo run --locked --quiet --manifest-path tools/ci/Cargo.toml -- build-desktop --step install_linux_deps

      # 7. Adım: Sadece Mac derlemesi için WebRTC bağımlılıklarını ve Python setuptools kurar.
      - name: Install macOS dependencies
        if: matrix.platform == 'mac'
        run: |
          brew install nasm yasm pkg-config cmake
          cargo run --locked --quiet --manifest-path tools/ci/Cargo.toml -- build-desktop --step install_setuptools_macos
          
      # 8. Adım: Tüm Node/Rust bağımlılıklarını kurar.
      - name: Install dependencies
        run: pnpm install
      
      # 9. Adım: Kaynak kodları derler. 
      - name: Build desktop
        working-directory: fluxer_desktop
        env:
          NODE_ENV: production
          FLUXER_DESKTOP_PRODUCTION: 'true'
          PUBLIC_RELEASE_CHANNEL: stable
          PUBLIC_BUILD_VERSION: ${{ github.ref_name }}
          ELECTRON_ARCH: ${{ matrix.arch }}
        run: pnpm build
        
      # 10. Adım: Sadece Mac derlemesi için electron-builder'ı çalıştırır.
      - name: Package (mac)
        if: matrix.platform == 'mac'
        working-directory: fluxer_desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_ARCH: ${{ matrix.arch }}
        run: pnpm exec electron-builder --config electron-builder.config.cjs --mac --publish never
        
      # 11. Adım: Windows ve Linux derlemeleri için electron-builder'ı çalıştırır.
      - name: Package (win/linux)
        if: matrix.platform != 'mac'
        working-directory: fluxer_desktop
        env:
          ELECTRON_ARCH: ${{ matrix.arch }}
        run: pnpm exec electron-builder --config electron-builder.config.cjs --${{ matrix.platform }} --publish never
        
      # 12. Adım: Çıktıları (Artifacts) yükler. if: always() sayesinde bir platform hata verse bile başarılı olanlar indirilebilir.
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cacha-fluxer-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            fluxer_desktop/dist/*.dmg
            fluxer_desktop/dist/*.exe
            fluxer_desktop/dist/*.AppImage
            fluxer_desktop/dist/*.deb
            fluxer_desktop/dist-electron/*.dmg
            fluxer_desktop/dist-electron/*.exe
            fluxer_desktop/dist-electron/*.AppImage
            fluxer_desktop/dist-electron/*.deb