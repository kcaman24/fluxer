# İş akışının (workflow) adı. GitHub Actions sekmesinde bu isimle görünür.
name: Build CaCha-Fluxer Desktop

# "on" bloğu, bu derlemenin ne zaman otomatik olarak başlayacağını belirler.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# "jobs" bloğu, yapılacak asıl işleri (derleme süreçlerini) içerir.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
            arch: arm64
            rust_target: aarch64-apple-darwin
          - os: windows-latest
            platform: win
            arch: x64
            rust_target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            rust_target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      # 1. Adım: Repo'yu indir
      - uses: actions/checkout@v4

      # 2. Adım: pnpm kur
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # 3. Adım: Node.js 20 kur
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      # 4. Adım: Rust 1.93.0 kur ve hedef mimariyi ekle
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"
          targets: ${{ matrix.rust_target }}

      # 5. Adım: Sadece Linux için TÜM sistem bağımlılıklarını kur
      - name: Install Linux deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev libdbus-1-dev libpulse-dev libevdev-dev \
            libssl-dev libvpx-dev libopus-dev pkg-config clang libclang-dev \
            libudev-dev libpcsclite-dev build-essential python3 cmake

      # 6. Adım: Sadece Mac için WebRTC ve Python bağımlılıklarını kur
      - name: Install macOS deps
        if: matrix.platform == 'mac'
        run: |
          brew install nasm yasm pkg-config cmake
          pip3 install setuptools

      # 7. Adım: KRİTİK - pnpm install KÖK DİZİNDE çalıştırılmalı (monorepo yapısı)
      - name: Install dependencies (root)
        run: pnpm install

      # 8. Adım: fluxer_desktop klasöründe node_modules var mı kontrol et
      - name: Verify node_modules
        run: |
          echo "=== Kök dizin ==="
          ls -la node_modules 2>/dev/null | head -5 || echo "Kök node_modules yok!"
          echo "=== fluxer_desktop dizini ==="
          ls -la fluxer_desktop/node_modules 2>/dev/null | head -5 || echo "fluxer_desktop/node_modules yok!"

      # 9. Adım: Build (RUST_BACKTRACE=1 ile detaylı hata almak için)
      - name: Build desktop
        working-directory: fluxer_desktop
        env:
          NODE_ENV: production
          FLUXER_DESKTOP_PRODUCTION: 'true'
          PUBLIC_RELEASE_CHANNEL: stable
          PUBLIC_BUILD_VERSION: ${{ github.ref_name }}
          ELECTRON_ARCH: ${{ matrix.arch }}
          RUST_BACKTRACE: 1
        run: pnpm build

      # 10. Adım: Mac paketleme
      - name: Package (mac)
        if: matrix.platform == 'mac'
        working-directory: fluxer_desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_ARCH: ${{ matrix.arch }}
        run: pnpm exec electron-builder --config electron-builder.config.cjs --mac --publish never

      # 11. Adım: Windows ve Linux paketleme
      - name: Package (win/linux)
        if: matrix.platform != 'mac'
        working-directory: fluxer_desktop
        env:
          ELECTRON_ARCH: ${{ matrix.arch }}
        run: pnpm exec electron-builder --config electron-builder.config.cjs --${{ matrix.platform }} --publish never

      # 12. Adım: DEBUG - Çıktı klasörlerini listele (Artifact'in nerede olduğunu bulmak için)
      - name: List all output files (debug)
        if: always()
        working-directory: fluxer_desktop
        run: |
          echo "=== dist ==="
          ls -la dist 2>/dev/null || echo "dist yok"
          echo "=== dist-electron ==="
          ls -la dist-electron 2>/dev/null || echo "dist-electron yok"
          echo "=== release ==="
          ls -la release 2>/dev/null || echo "release yok"
          echo "=== build ==="
          ls -la build 2>/dev/null || echo "build yok"
          echo "=== Tüm .exe, .dmg, .AppImage dosyaları ==="
          find . -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" 2>/dev/null || true

      # 13. Adım: Artifacts yükle - Tüm olası klasörleri dahil et
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cacha-fluxer-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            fluxer_desktop/dist/
            fluxer_desktop/dist-electron/
            fluxer_desktop/release/
            fluxer_desktop/build/