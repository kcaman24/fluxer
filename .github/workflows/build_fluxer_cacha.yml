# ==============================================================================
# CaCha-Fluxer Desktop Build Workflow (Final)
# Windows (x64), macOS (ARM64), Linux (x64) için derleme yapar
# ==============================================================================

name: Build CaCha-Fluxer Desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.platform }} ${{ matrix.arch }})
    
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS - Apple Silicon (M1/M2/M3) - arm64
          - os: macos-14
            platform: mac
            arch: arm64
            rust_target: aarch64-apple-darwin
          
          # Windows - x64
          - os: windows-latest
            platform: win
            arch: x64
            rust_target: x86_64-pc-windows-msvc
          
          # Linux - x64
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            rust_target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      # ======================================================================
      # ADIM 1: Kaynak kodu indir
      # ======================================================================
      - name: Checkout source
        uses: actions/checkout@v4

      # ======================================================================
      # ADIM 2: Rust toolchain kur (1.93.0 sabit)
      # ======================================================================
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"
          targets: ${{ matrix.rust_target }}

      # ======================================================================
      # ADIM 3: Node.js 20 kur
      # ======================================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ======================================================================
      # ADIM 4: pnpm kur (corepack üzerinden)
      # ======================================================================
      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      # ======================================================================
      # ADIM 5: İşletim sistemine göre sistem bağımlılıklarını kur
      # ======================================================================
      
      # --- Linux bağımlılıkları ---
      # libfido2-dev: WebAuthn için
      # libclang-dev: Rust bindgen için (fido/es384.h hatasını çözer)
      # libvpx-dev, libopus-dev: WebRTC için
      # libgtk-3-dev, libwebkit2gtk-4.1-dev: Electron için
      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            clang \
            libclang-dev \
            pkg-config \
            python3 \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libdbus-1-dev \
            libpulse-dev \
            libevdev-dev \
            libssl-dev \
            libvpx-dev \
            libopus-dev \
            libudev-dev \
            libpcsclite-dev \
            libfido2-dev

      # --- macOS bağımlılıkları ---
      - name: Install macOS system dependencies
        if: matrix.platform == 'mac'
        run: |
          brew install nasm yasm pkg-config cmake python-setuptools

      # --- Windows bağımlılıkları ---
      - name: Setup Python (Windows)
        if: matrix.platform == 'win'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # ======================================================================
      # ADIM 6: Node.js bağımlılıklarını kur (KÖK DİZİNDE)
      # ======================================================================
      - name: Install Node.js dependencies (root)
        run: pnpm install

      # ======================================================================
      # ADIM 7: fluxer_desktop/node_modules kontrolü (debug)
      # ======================================================================
      - name: Verify node_modules exists
        shell: bash
        run: |
          echo "=== Kök dizin node_modules ==="
          ls node_modules/.pnpm 2>/dev/null | head -5 || echo "HATA: Kök node_modules yok!"
          echo ""
          echo "=== fluxer_desktop/node_modules ==="
          ls fluxer_desktop/node_modules 2>/dev/null | head -5 || echo "HATA: fluxer_desktop/node_modules yok!"
          echo ""
          echo "=== @fluxer paketleri ==="
          ls node_modules/.pnpm 2>/dev/null | grep "@fluxer" | head -10 || echo "HATA: @fluxer paketleri bulunamadı!"

      # ======================================================================
      # ADIM 8: Kaynak kodu derle
      # ======================================================================
      # Linux için BINDGEN_EXTRA_CLANG_ARGS ayarla (fido/es384.h hatasını çözer)
      # macOS için SDKROOT ayarla
      - name: Build desktop app
        working-directory: fluxer_desktop
        env:
          NODE_ENV: production
          FLUXER_DESKTOP_PRODUCTION: 'true'
          PUBLIC_RELEASE_CHANNEL: stable
          PUBLIC_BUILD_VERSION: ${{ github.ref_name }}
          ELECTRON_ARCH: ${{ matrix.arch }}
          RUST_BACKTRACE: 1
          # Linux: clang'a sistem header'larını bulması için yol ver
          BINDGEN_EXTRA_CLANG_ARGS: ${{ matrix.platform == 'linux' && '-I/usr/include -I/usr/include/x86_64-linux-gnu' || '' }}
          # macOS: SDK yolunu ayarla
          SDKROOT: ${{ matrix.platform == 'mac' && '/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk' || '' }}
        run: pnpm build

      # ======================================================================
      # ADIM 9: Uygulamayı paketle
      # ======================================================================
      
      # --- macOS paketleme ---
      - name: Package macOS app
        if: matrix.platform == 'mac'
        working-directory: fluxer_desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_ARCH: ${{ matrix.arch }}
        run: pnpm exec electron-builder --config electron-builder.config.cjs --mac --publish never

      # --- Windows ve Linux paketleme ---
      - name: Package Windows/Linux app
        if: matrix.platform != 'mac'
        working-directory: fluxer_desktop
        env:
          ELECTRON_ARCH: ${{ matrix.arch }}
        run: pnpm exec electron-builder --config electron-builder.config.cjs --${{ matrix.platform }} --publish never

      # ======================================================================
      # ADIM 10: Çıktı dosyalarını listele (debug)
      # ======================================================================
      - name: List all output files (debug)
        if: always()
        shell: bash
        working-directory: fluxer_desktop
        run: |
          echo "========================================="
          echo "ÇIKTI DOSYALARI ARANIYOR..."
          echo "========================================="
          echo ""
          echo "--- dist/ klasörü ---"
          find dist -type f 2>/dev/null || echo "(yok)"
          echo ""
          echo "--- dist-electron/ klasörü ---"
          find dist-electron -type f 2>/dev/null || echo "(yok)"
          echo ""
          echo "--- release/ klasörü ---"
          find release -type f 2>/dev/null || echo "(yok)"
          echo ""
          echo "--- build/ klasörü ---"
          find build -type f 2>/dev/null || echo "(yok)"
          echo ""
          echo "--- Tüm .exe dosyaları ---"
          find . -name "*.exe" -type f 2>/dev/null || echo "(yok)"
          echo ""
          echo "--- Tüm .dmg dosyaları ---"
          find . -name "*.dmg" -type f 2>/dev/null || echo "(yok)"
          echo ""
          echo "--- Tüm .AppImage dosyaları ---"
          find . -name "*.AppImage" -type f 2>/dev/null || echo "(yok)"
          echo ""
          echo "--- Tüm .deb dosyaları ---"
          find . -name "*.deb" -type f 2>/dev/null || echo "(yok)"
          echo ""
          echo "========================================="
          echo "ARAMA TAMAMLANDI"
          echo "========================================="

      # ======================================================================
      # ADIM 11: Çıktıları (Artifacts) GitHub'a yükle
      # ======================================================================
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cacha-fluxer-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            **/*.exe
            **/*.dmg
            **/*.AppImage
            **/*.deb
            **/*.rpm
            **/*.zip
          if-no-files-found: warn
          retention-days: 90