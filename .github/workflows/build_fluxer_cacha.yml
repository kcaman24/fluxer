# ==============================================================================
# CaCha-Fluxer Desktop Build Workflow (macOS - x64 + arm64)
# ==============================================================================

name: Build CaCha-Fluxer (macOS)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build (macos ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
            rust_target: aarch64-apple-darwin
            electron_arch: arm64
          - arch: x64
            runner: macos-13
            rust_target: x86_64-apple-darwin
            electron_arch: x64

    steps:
      # ======================================================================
      # ADIM 1: Kaynak kodu indir
      # ======================================================================
      - name: Checkout source
        uses: actions/checkout@v4

      # ======================================================================
      # ADIM 2: Rust toolchain kur (1.93.0 sabit)
      # ======================================================================
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"
          targets: ${{ matrix.rust_target }}

      # ======================================================================
      # ADIM 3: Node.js 20 kur
      # ======================================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ======================================================================
      # ADIM 4: pnpm kur (corepack üzerinden)
      # ======================================================================
      - name: Setup pnpm
        shell: bash
        run: corepack enable && corepack prepare pnpm@latest --activate

      # ======================================================================
      # ADIM 5: macOS sistem bağımlılıklarını kur (Homebrew)
      # ======================================================================
      # NOT: Linux'taki gibi eski/donmuş apt paketleri sorunu Homebrew'da
      # genelde yaşanmıyor çünkü brew formulaları upstream'i sik sik takip
      # ediyor. Yine de bir formula geride kalirsa ayni "es384.h" tarzi
      # hata cikabilir - o zaman 'brew install libfido2 --HEAD' denenebilir.
      - name: Install macOS system dependencies
        shell: bash
        run: |
          brew update
          brew install \
            cmake \
            pkg-config \
            libfido2 \
            opus \
            libvpx \
            ffmpeg \
            pipewire || true
          # pipewire macOS'ta anlamli degil (Linux-only), yukaridaki satir
          # formul yoksa sessizce gecer (|| true). Gercek native modul
          # gereksinimlerine gore bu listeyi daraltabiliriz.

      # ======================================================================
      # ADIM 5b: libfido2 header dogrulama (erken hata yakalama)
      # ======================================================================
      - name: Verify fido2 headers
        shell: bash
        run: |
          FIDO2_PREFIX=$(brew --prefix libfido2)
          echo "libfido2 prefix: $FIDO2_PREFIX"
          test -f "$FIDO2_PREFIX/include/fido/es384.h" \
            && echo "es384.h OK" \