# ==============================================================================
# CaCha-Fluxer Desktop Build Workflow (Final v6)
# Windows (x64), macOS (ARM64), Linux (x64) için derleme yapar
# ==============================================================================

name: Build CaCha-Fluxer Desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.platform }} ${{ matrix.arch }})
    
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS - Apple Silicon (arm64) - macos-14 kullanılıyor
          - os: macos-14
            platform: mac
            arch: arm64
            rust_target: aarch64-apple-darwin
          
          # Windows - x64
          - os: windows-latest
            platform: win
            arch: x64
            rust_target: x86_64-pc-windows-msvc
          
          # Linux - x64
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            rust_target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      # ======================================================================
      # ADIM 1: Kaynak kodu indir
      # ======================================================================
      - name: Checkout source
        uses: actions/checkout@v4

      # ======================================================================
      # ADIM 2: macOS için Xcode 15.2'ye düşür (libc++ pointer_traits hatasını çözer)
      # ======================================================================
      - name: Setup Xcode (macOS)
        if: matrix.platform == 'mac'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.2'

      # ======================================================================
      # ADIM 3: Rust toolchain kur (1.93.0 sabit)
      # ======================================================================
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"
          targets: ${{ matrix.rust_target }}

      # ======================================================================
      # ADIM 4: Node.js 20 kur
      # ======================================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ======================================================================
      # ADIM 5: pnpm kur (corepack üzerinden)
      # ======================================================================
      - name: Setup pnpm
        shell: bash
        run: corepack enable && corepack prepare pnpm@latest --activate

      # ======================================================================
      # ADIM 6: İşletim sistemine göre sistem bağımlılıklarını kur
      # ======================================================================
      
      # --- Linux bağımlılıkları ---
      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            llvm \
            clang \
            libclang-dev \
            pkg-config \
            python3 \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libdbus-1-dev \
            libpulse-dev \
            libevdev-dev \
            libssl-dev \
            libvpx-dev \
            libopus-dev \
            libudev-dev \
            libpcsclite-dev \
            libfido2-dev

      # --- macOS bağımlılıkları ---
      - name: Install macOS system dependencies
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          brew install nasm yasm pkg-config cmake python-setuptools

      # --- Windows bağımlılıkları ---
      - name: Setup Python (Windows)
        if: matrix.platform == 'win'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # ======================================================================
      # ADIM 7: Node.js bağımlılıklarını kur (KÖK DİZİNDE)
      # ======================================================================
      - name: Install Node.js dependencies (root)
        shell: bash
        run: pnpm install

      # ======================================================================
      # ADIM 8: Kaynak kodu derle
      # ======================================================================
      # KRİTİK DÜZELTME: Linux için LIBCLANG_PATH ve BINDGEN_EXTRA_CLANG_ARGS eklendi
      # Bu sayede fido/es384.h hatası çözülür.
      - name: Build desktop app
        working-directory: fluxer_desktop
        shell: bash
        env:
          NODE_ENV: production
          FLUXER_DESKTOP_PRODUCTION: 'true'
          PUBLIC_RELEASE_CHANNEL: stable
          PUBLIC_BUILD_VERSION: ${{ github.ref_name }}
          ELECTRON_ARCH: ${{ matrix.arch }}
          # Linux: clang'a sistem header'larını bulması için yol ver
          LIBCLANG_PATH: ${{ matrix.platform == 'linux' && '/usr/lib/llvm-14/lib' || '' }}
          BINDGEN_EXTRA_CLANG_ARGS: ${{ matrix.platform == 'linux' && '-I/usr/include -I/usr/include/x86_64-linux-gnu' || '' }}
          # macOS: SDK ve deployment target ayarla
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.platform == 'mac' && '12.0' || '' }}
          SDKROOT: ${{ matrix.platform == 'mac' && '/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk' || '' }}
        run: pnpm build

      # ======================================================================
      # ADIM 9: Uygulamayı paketle
      # ======================================================================
      
      # --- macOS paketleme ---
      - name: Package macOS app
        if: matrix.platform == 'mac'
        working-directory: fluxer_desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_ARCH: ${{ matrix.arch }}
          MACOSX_DEPLOYMENT_TARGET: '12.0'
          SDKROOT: '/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk'
        run: pnpm exec electron-builder --config electron-builder.config.cjs --mac --publish never

      # --- Windows ve Linux paketleme ---
      - name: Package Windows/Linux app
        if: matrix.platform != 'mac'
        working-directory: fluxer_desktop
        shell: bash
        env:
          ELECTRON_ARCH: ${{ matrix.arch }}
        run: pnpm exec electron-builder --config electron-builder.config.cjs --${{ matrix.platform }} --publish never

      # ======================================================================
      # ADIM 10: Çıktıları (Artifacts) GitHub'a yükle
      # ======================================================================
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cacha-fluxer-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            **/*.exe
            **/*.dmg
            **/*.AppImage
            **/*.deb
            **/*.rpm
            **/*.zip
          if-no-files-found: warn
          retention-days: 90