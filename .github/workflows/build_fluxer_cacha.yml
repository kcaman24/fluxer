# ==============================================================================
# CaCha-Fluxer Desktop Build Workflow (macOS arm64 - Apple Silicon)
# ==============================================================================

name: Build CaCha-Fluxer (macOS)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build (macos arm64)
    runs-on: macos-14

    steps:
      # ======================================================================
      # ADIM 1: Kaynak kodu indir
      # ======================================================================
      - name: Checkout source
        uses: actions/checkout@v4

      # ======================================================================
      # ADIM 2: Rust toolchain kur (1.93.0 sabit)
      # ======================================================================
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"
          targets: aarch64-apple-darwin

      # ======================================================================
      # ADIM 3: Node.js 20 kur
      # ======================================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ======================================================================
      # ADIM 4: pnpm kur (corepack üzerinden)
      # ======================================================================
      - name: Setup pnpm
        shell: bash
        run: corepack enable && corepack prepare pnpm@latest --activate

      # ======================================================================
      # ADIM 5: macOS sistem bağımlılıklarını kur (Homebrew)
      # ======================================================================
      # NOT: 'pipewire' formulu kasitli olarak KALDIRILDI - Homebrew'da
      # sadece Linux icin destekleniyor (formulae.brew.sh: "Requires: Linux").
      # Onceki denemede listeye eklenmisti ve brew install tum formulleri
      # tek seferde cozumledigi icin pipewire cozumlenemeyince komut
      # basarisiz oldu; sonundaki '|| true' bu hatayi sessizce yuttugu icin
      # libfido2 dahil HICBIR PAKET KURULMADI. Artik '|| true' yok - gercek
      # hatalar sessizce yutulmuyor.
      - name: Install macOS system dependencies
        shell: bash
        run: |
          brew update
          brew install \
            cmake \
            pkg-config \
            libfido2 \
            opus \
            libvpx \
            ffmpeg

      # ======================================================================
      # ADIM 5b: libfido2 header dogrulama (erken hata yakalama)
      # ======================================================================
      - name: Verify fido2 headers
        shell: bash
        run: |
          FIDO2_PREFIX=$(brew --prefix libfido2)
          echo "libfido2 prefix: $FIDO2_PREFIX"
          if [ -f "$FIDO2_PREFIX/include/fido/es384.h" ]; then
            echo "es384.h OK"
          else
            echo "es384.h MISSING - libfido2 dogru kurulmamis olabilir"
            ls -la "$FIDO2_PREFIX/include/fido/" 2>/dev/null || echo "fido/ dizini de yok"
            exit 1
          fi
          echo "PKG_CONFIG_PATH_EXTRA=$FIDO2_PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"

      # ======================================================================
      # ADIM 6: Node.js bağımlılıklarını kur (KÖK DİZİNDE)
      # ======================================================================
      - name: Install Node.js dependencies (root)
        shell: bash
        run: pnpm install

      # ======================================================================
      # ADIM 6b: Build oncesi diagnostik (disk / bellek)
      # ======================================================================
      # NOT: "exit code 1, sifir cikti" imzasi bazen disk dolu ya da bellek
      # yetersizligi durumunda gorulur. Build'den once durumu logluyoruz ki
      # bu ihtimali gozle kontrol edebilelim.
      - name: Pre-build diagnostics
        shell: bash
        run: |
          echo "--- Disk kullanimi ---"
          df -h /
          echo "--- Bellek (fiziksel) ---"
          sysctl hw.memsize
          echo "--- vm_stat ---"
          vm_stat
          echo "--- Aktif Xcode ---"
          xcode-select -p
          xcrun --show-sdk-path

      # ======================================================================
      # ADIM 7: Kaynak kodu derle
      # ======================================================================
      # NOT: Cikti hem terminale hem de bir log dosyasina yaziliyor (tee).
      # Boylece GitHub Actions log arayuzunun cok uzun satirlari kesmesi/
      # kaybetmesi ihtimaline karsi ham log dosyasini ADIM 7b'de artifact
      # olarak indirebiliyoruz - gercek derleyici hatasini kacirmayacagiz.
      - name: Build desktop app
        working-directory: fluxer_desktop
        shell: bash
        env:
          NODE_ENV: production
          FLUXER_DESKTOP_PRODUCTION: 'true'
          PUBLIC_RELEASE_CHANNEL: stable
          PUBLIC_BUILD_VERSION: ${{ github.ref_name }}
          ELECTRON_ARCH: arm64
          MACOSX_DEPLOYMENT_TARGET: '11.0'
          PKG_CONFIG_PATH: /opt/homebrew/lib/pkgconfig:${{ env.PKG_CONFIG_PATH_EXTRA }}
          PKG_CONFIG_ALLOW_SYSTEM_CFLAGS: 1
          PKG_CONFIG_ALLOW_SYSTEM_LIBS: 1
        run: |
          unset CFLAGS CXXFLAGS C_INCLUDE_PATH CPLUS_INCLUDE_PATH
          set -o pipefail
          env -u CFLAGS -u CXXFLAGS -u C_INCLUDE_PATH -u CPLUS_INCLUDE_PATH \
            pnpm build 2>&1 | tee /tmp/fluxer-build.log

      # ======================================================================
      # ADIM 7b: Build log'unu her durumda artifact olarak yukle
      # ======================================================================
      - name: Upload full build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-arm64-build-log
          path: /tmp/fluxer-build.log
          retention-days: 7
      # ======================================================================
      # ADIM 8: Uygulamayı paketle (imzasız - Apple Developer sertifikası yok)
      # ======================================================================
      # NOT: CSC_IDENTITY_AUTO_DISCOVERY=false, electron-builder'in Keychain'de
      # olmayan bir imzalama sertifikasi aramasini engeller. Imzasiz .dmg/.zip
      # calisir ama kullanicilar ilk acilista Gatekeeper uyarisi gorur
      # (sag tik > Ac ile gecilebilir). Kendi Apple Developer sertifikan
      # varsa CSC_LINK / CSC_KEY_PASSWORD secret'lari eklenip bu satir
      # kaldirilmali - notarization icin de ayri bir adim gerekir.
      - name: Package macOS app
        working-directory: fluxer_desktop
        shell: bash
        env:
          ELECTRON_ARCH: arm64
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm exec electron-builder --config electron-builder.config.cjs --mac --arm64 --publish never

      # ======================================================================
      # ADIM 9: Çıktıları (Artifacts) GitHub'a yükle
      # ======================================================================
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cacha-fluxer-macos-arm64
          path: |
            **/*.dmg
            **/*.zip
            **/*.pkg
          if-no-files-found: warn
          retention-days: 90