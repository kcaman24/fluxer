# İş akışının (workflow) adı. GitHub Actions sekmesinde bu isimle görünür.
name: Build CaCha-Fluxer Desktop

# "on" bloğu, bu derlemenin ne zaman otomatik olarak başlayacağını belirler.
on:
  # Eğer "v1.0.0" gibi "v" harfiyle başlayan bir etiket (tag) push'larsan çalışır.
  push:
    tags: ['v*']
  # GitHub arayüzünden manuel olarak "Run Workflow" butonuna basıldığında da çalışmasına izin verir.
  workflow_dispatch:

# "jobs" bloğu, yapılacak asıl işleri (derleme süreçlerini) içerir.
jobs:
  build:
    # "strategy" ile aynı işi farklı ortamlarda (matrix) paralel olarak çalıştırabiliriz.
    strategy:
      fail-fast: false # Bir platformda hata çıkarsa diğerlerinin devam etmesine izin verir.
      matrix:
        # Intel Mac (macos-13) kaldırıldı. Sadece Apple Silicon, Windows ve Linux kaldı.
        include:
          - os: macos-14       # Apple Silicon (M1/M2/M3) çipli Mac ortamı
            platform: mac
            arch: arm64
          - os: windows-latest # Windows ortamı
            platform: win
            arch: x64
          - os: ubuntu-22.04   # Linux ortamı
            platform: linux
            arch: x64
            
    # Her bir matrix işi, yukarıda tanımladığımız o işletim sisteminde (os) çalışacak.
    runs-on: ${{ matrix.os }}
    
    # "steps" adımları sırayla çalıştırılacak komutlardır.
    steps:
      # 1. Adım: GitHub'daki fork'ladığınız repo kodlarını sunucuya indirir.
      - uses: actions/checkout@v4
      
      # 2. Adım: pnpm paket yöneticisini kurar.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        
      # 3. Adım: Node.js 20 sürümünü kurar ve pnpm önbelleğini (cache) aktif eder.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          
      # 4. Adım: Rust toolchain'i kurar.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"
        
      # 5. Adım: Sadece Linux derlemesi çalışıyorsa burası çalışır. 
      # WebRTC, WebAuthn(libfido2) ve genel sistem için gereken tüm kütüphaneler.
      - name: Install Linux deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libdbus-1-dev libpulse-dev libevdev-dev libssl-dev libvpx-dev libopus-dev pkg-config clang libclang-dev libudev-dev libpcsclite-dev build-essential python3
          
      # 5.5. Adım: Sadece Mac derlemesi çalışıyorsa burası çalışır. 
      # WebRTC'nin video/camera özelliklerinin derlenmesi için gereken düşük seviyeli araçlar.
      - name: Install macOS deps
        if: matrix.platform == 'mac'
        run: brew install nasm yasm pkg-config cmake
          
      # 6. Adım: Tüm bağımlılıkları kurar. --frozen-lockfile KALDIRILDI.
      # Çünkü dosyaları değiştirdiğimiz için kilit dosyası eski kalıyordu ve kuruluma izin vermiyordu.
      - name: Install dependencies
        run: pnpm install
      
      # 7. Adım: Kaynak kodları derler. 
      - name: Build desktop
        working-directory: fluxer_desktop
        env:
          NODE_ENV: production
          FLUXER_DESKTOP_PRODUCTION: 'true'
          PUBLIC_RELEASE_CHANNEL: stable
          PUBLIC_BUILD_VERSION: ${{ github.ref_name }}
          ELECTRON_ARCH: ${{ matrix.arch }}
        run: pnpm build
        
      # 8. Adım: Sadece Mac derlemesi için electron-builder'ı çalıştırır.
      - name: Package (mac)
        if: matrix.platform == 'mac'
        working-directory: fluxer_desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_ARCH: ${{ matrix.arch }}
        run: pnpm exec electron-builder --config electron-builder.config.cjs --mac --publish never
        
      # 9. Adım: Windows ve Linux derlemeleri için electron-builder'ı çalıştırır.
      - name: Package (win/linux)
        if: matrix.platform != 'mac'
        working-directory: fluxer_desktop
        env:
          ELECTRON_ARCH: ${{ matrix.arch }}
        run: pnpm exec electron-builder --config electron-builder.config.cjs --${{ matrix.platform }} --publish never
        
      # 10. Adım: Çıktıları (Artifacts) yükler.
      # if: always() eklendi ki, bir platform başarısız olsa bile başarılı olanların çıktıları (Windows gibi) kaybolmasın.
      # path kısmına hem dist hem dist-electron eklendi ki dosyalar kaçmasın.
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cacha-fluxer-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            fluxer_desktop/dist/*.dmg
            fluxer_desktop/dist/*.exe
            fluxer_desktop/dist/*.AppImage
            fluxer_desktop/dist/*.deb
            fluxer_desktop/dist-electron/*.dmg
            fluxer_desktop/dist-electron/*.exe
            fluxer_desktop/dist-electron/*.AppImage
            fluxer_desktop/dist-electron/*.deb